<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>grew-tv</title>
<style>
:root {
  --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 45%, #0f3460 100%);
  --surface: rgba(255,255,255,0.06);
  --surface-hi: rgba(255,255,255,0.11);
  --border: rgba(255,255,255,0.13);
  --focus: #fff;
  --text: rgba(255,255,255,0.95);
  --text-muted: rgba(255,255,255,0.4);
  --radius: 16px;
  --radius-sm: 8px;
  --dur: 0.18s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); background-attachment: fixed; color: var(--text); font-family: var(--font); }
body { display: flex; flex-direction: column; padding: 16px; gap: 12px; }
#conn-status { font-size: 13px; font-family: monospace; color: var(--text-muted); text-align: center; height: 16px; flex-shrink: 0; }
#ctx-label { font-size: 12px; color: var(--text-muted); text-align: center; text-transform: uppercase; letter-spacing: 1px; min-height: 16px; }
#now-title { font-size: 22px; color: var(--text); text-align: center; min-height: 28px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.still { height: 150px; background: #000; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--text-muted); flex-shrink: 0; }
.bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--focus); }
.time { font-size: 13px; color: var(--text-muted); text-align: right; font-variant-numeric: tabular-nums; }
.transport { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.transport button { flex: 1; padding: 18px 8px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--surface); color: var(--text); font-size: 24px; cursor: pointer; touch-action: manipulation; transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.transport button:active { background: var(--surface-hi); border-color: var(--focus); color: var(--focus); }
.transport .cc { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.transport .cc.on { border-color: var(--focus); color: var(--focus); background: var(--surface-hi); }
.transport .rp.on { border-color: var(--focus); color: var(--focus); background: var(--surface-hi); }
.transport .nm { font-size: 15px; flex: 2; }
.transport .nm.on { border-color: var(--focus); color: var(--focus); background: var(--surface-hi); }
.transport button.single { opacity: 0.35; pointer-events: none; }
.footer-row { display: flex; gap: 8px; align-items: stretch; margin-top: 12px; }
.reset-btn { flex: 1; min-width: 0; padding: 14px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--surface); color: var(--text); font-size: 16px; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.reset-btn.confirm { border-color: #ffce6b; color: #ffce6b; }
.jump { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.jump-btn { padding: 12px 4px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--surface-hi); color: var(--text); font-size: 13px; cursor: pointer; touch-action: manipulation; font-variant-numeric: tabular-nums; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.jump-btn:active { background: var(--surface-hi); border-color: var(--focus); color: var(--focus); }
.bignext { background: var(--surface-hi); border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; font-size: 14px; color: var(--text-muted); min-height: 44px; }
#breadcrumb { flex-shrink: 0; }
.breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.crumb { font-size: 13px; }
.crumb-current { color: var(--text-muted); }
.crumb-sep { color: var(--text-muted); font-size: 13px; }
.crumb-link { background: none; border: none; padding: 2px 4px; margin: 0; color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; border-radius: var(--radius-sm); touch-action: manipulation; transition: color var(--dur) var(--ease); }
.crumb-link:active { color: var(--focus); }
.crumb-link:focus { outline: 1px solid var(--focus); }
#screen-bar { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
#screen-bar:empty { display: none; }
.screen-bar-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.screen-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.screen-current { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.screen-current:active, .screen-current:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.screen-btn { width: 100%; padding: 10px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.screen-btn:active, .screen-btn:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.screen-btn.on { border-color: var(--focus); color: var(--focus); }
.screen-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.55); flex-shrink: 0; }
.screen-btn, .screen-current { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-start; }
.screen-btn-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sync-bar { display: flex; }
#sync-bar .seg { width: 100%; }
#sync-bar .seg-opt { flex: 1 1 0; }
.seg { display: inline-flex; flex: 0 0 auto; border: 2px solid var(--border); border-radius: 999px; overflow: hidden; }
.seg-opt { font-size: 13px; padding: 8px 10px; white-space: nowrap; border: none; background: transparent; color: var(--text-muted); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.seg-opt.on { background: var(--surface-hi); color: var(--focus); }
.seg-opt:active { color: var(--focus); }
.seg-opt:focus { outline: 2px solid var(--focus); outline-offset: -2px; }
#topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-shrink: 0; position: relative; }
#c-repeat.hidden, #c-shuffle.hidden, #c-queue.hidden, #c-add-playlist.hidden { display: none; }
/* TASK-564 — channel mode's row, and the queue row it stands in for. */
#channel-row.hidden, #queue-row.hidden, #c-live.hidden { display: none; }
#c-live { border-color: var(--focus); color: var(--focus); }
.desync-off { opacity: 0.35; pointer-events: none; }
.browsing .transport, .browsing #jump, .browsing #c-reset, .browsing #switch-profile { opacity: 0.35; pointer-events: none; }
#add-sheet { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; background: rgba(0,0,0,0.62); }
.add-sheet-panel { background: #16213e; border: 2px solid var(--border); border-radius: var(--radius); padding: 22px; margin: 24px; width: 100%; max-width: 360px; max-height: 76vh; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 50px rgba(0,0,0,0.55); }
.add-sheet-title { font-size: 18px; text-align: center; }
#add-sheet-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.add-choice { padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 16px; font-family: inherit; text-align: left; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.add-choice:active, .add-choice:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.add-sheet-act { padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 16px; font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.add-sheet-act:active, .add-sheet-act:focus { outline: none; border-color: var(--focus); color: var(--focus); }
#btn-add-create { border-color: #7ee787; color: #7ee787; }
#add-status { display: none; position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 11; padding: 12px 22px; background: #1f2d50; border: 2px solid var(--border); border-radius: var(--radius); font-size: 15px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div id="conn-status">connecting…</div>
<div id="topbar-actions">
  <div id="status-menu-mount"></div>
</div>
<div id="breadcrumb"></div>
<div id="ctx-label"></div>
<div id="now-title"></div>
<div class="still">▶</div>
<div class="bar"><i id="bar-fill"></i></div>
<div id="time" class="time"></div>
<div class="transport">
  <button id="c-prev" aria-label="Previous">⏮</button>
  <button id="c-toggle" aria-label="Play/Pause">⏯</button>
  <button id="c-next" aria-label="Next">⏭</button>
  <button id="c-repeat" class="rp" aria-label="Repeat">🔁</button>
  <button id="c-shuffle" class="rp hidden" aria-label="Shuffle">🔀</button>
  <button id="c-cc" class="cc" aria-label="Subtitles">CC</button>
</div>
<div class="transport">
  <button id="c-vol-down" aria-label="Volume down">🔉</button>
  <button id="c-vol-up" aria-label="Volume up">🔊</button>
  <button id="c-night" class="nm" aria-label="Night Mode">Night: Off</button>
</div>
<div class="jump" id="jump"></div>
<div id="upnext" class="bignext"></div>
<!-- TASK-564: channel mode's own row, the mirror of the TV player's two channel
     pills. Hidden for every queue rail; the Queue / Clear progress row hides in
     its place on a channel, which has neither a queue to open nor anything
     recorded to clear. -->
<div class="footer-row hidden" id="channel-row">
  <button id="c-restart" class="reset-btn" aria-label="Restart this programme">&#8635; Restart</button>
  <button id="c-live" class="reset-btn hidden" aria-label="Back to live">&#9679; Back to live</button>
</div>
<div class="footer-row" id="queue-row">
  <button id="c-queue" class="reset-btn" aria-label="Queue">☰ Queue</button>
  <button id="c-add-playlist" class="reset-btn hidden" aria-label="Add to playlist">＋ Playlist</button>
  <button id="c-reset" class="reset-btn" aria-label="Clear watch progress">&#8635; Clear progress</button>
</div>
<div class="footer-row">
  <button id="c-quickpause" class="reset-btn" aria-label="Quick Pause">&#9199; Quick Pause</button>
</div>
<div id="add-sheet" role="dialog" aria-modal="true">
  <div class="add-sheet-panel">
    <div class="add-sheet-title">Add to playlist</div>
    <div id="add-sheet-list"></div>
    <button id="btn-add-create" class="add-sheet-act" type="button">&#65291; New playlist</button>
    <button id="btn-add-cancel" class="add-sheet-act" type="button">Cancel</button>
  </div>
</div>
<div id="add-status"></div>
<script type="module">
import { initPage } from '../ui/screens/companion-video.js';
initPage();
</script>
</body>
</html>
