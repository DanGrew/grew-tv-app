<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>grew-tv</title>
<style>
:root {
  --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 45%, #0f3460 100%);
  --surface: rgba(255,255,255,0.06);
  --surface-hi: rgba(255,255,255,0.11);
  --border: rgba(255,255,255,0.13);
  --focus: #fff;
  --text: rgba(255,255,255,0.95);
  --text-muted: rgba(255,255,255,0.4);
  --danger: #ff6b6b;
  --radius: 16px;
  --radius-sm: 8px;
  --dur: 0.18s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); background-attachment: fixed; color: var(--text); font-family: var(--font); }
body { display: flex; flex-direction: column; padding: 16px; gap: 10px; }
#conn-status { font-size: 13px; font-family: monospace; color: var(--text-muted); text-align: center; height: 16px; flex-shrink: 0; }
.back { align-self: flex-start; flex-shrink: 0; background: none; border: 2px solid transparent; border-radius: var(--radius-sm); color: var(--text); font-size: 16px; line-height: 1.4; font-family: inherit; padding: 6px 8px; cursor: pointer; touch-action: manipulation; }
.back:active { color: var(--focus); }
.back:focus { outline: 1px solid var(--focus); }
/* TASK-516 — the crumb the shell renders (core/queue-crumb.js): the existing
   back button, then an inert "› Queue" leaf, so the phone reads
   "‹ Now Playing › Queue" as docs/QUEUE-UX-SHELL.md specifies. The leaf is
   muted, the way the TV's own .crumb-current already is. */
.ph-crumb { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.ph-crumb .back { align-self: auto; }
.ph-crumb-sep { color: var(--text-muted); font-size: 16px; }
.ph-crumb-current { color: var(--text-muted); font-size: 16px; line-height: 1.4; padding: 6px 8px; }
#queue-body { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }

.qs-ph-hero { display: flex; flex-direction: column; gap: 10px; }
.qs-ph-top { display: flex; gap: 12px; align-items: center; }
.qs-art { width: 64px; height: 64px; border-radius: var(--radius-sm); background: var(--surface-hi); display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--text-muted); flex-shrink: 0; overflow: hidden; }
.qs-art .poster-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
.qs-ph-body { flex: 1; min-width: 0; }
.qs-ph-title { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qs-ph-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qs-transport { display: flex; align-items: center; gap: 8px; }
.qs-tbtn { border-radius: 50%; border: 2px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.qs-tbtn:active, .qs-tbtn:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.qs-tbtn.on { border-color: var(--focus); background: var(--focus); color: #16213e; }
/* TASK-516 — a transport control with nothing to act on stays VISIBLE and
   dimmed, never hidden (docs/QUEUE-UX-SHELL.md's Hero section). */
.qs-tbtn.is-disabled { opacity: 0.32; pointer-events: none; }
.qs-tbtn-sm { width: 36px; height: 36px; }
.qs-tbtn-lg { width: 44px; height: 44px; font-size: 20px; }

.ph-qrow { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 8px 12px; }
.ph-qname { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 2px solid transparent; border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 15px; text-align: left; padding: 0; cursor: pointer; touch-action: manipulation; }
.ph-qname:active, .ph-qname:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.ph-qname .grip { width: 48px; height: 48px; border-radius: var(--radius-sm); background: var(--surface-hi); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 22px; flex-shrink: 0; overflow: hidden; }
.ph-qname .grip .poster-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
/* TASK-516 — a row is a title over a muted second line on BOTH surfaces
   (docs/QUEUE-UX-SHELL.md's Rows section); the phone carried only a title. */
.ph-qname .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ph-qname .nm .qs-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-qname .nm .qs-sub { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Coming Up is read-only, and now reads that way — the phone emitted no
   read-only class at all, so its rows looked editable but simply had no
   buttons. Matches the TV's own .qs-row.qs-readonly dimming. */
.ph-qrow.ph-readonly { opacity: 0.6; }
.acts { display: flex; gap: 6px; flex-shrink: 0; }
.ph-ract { width: 34px; height: 34px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.ph-ract:active, .ph-ract:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.ph-ract.is-disabled { opacity: 0.3; }
.ph-ract.x { color: var(--danger); border-color: rgba(255,107,107,0.4); }
.ph-ract.x:active, .ph-ract.x:focus { border-color: var(--danger); color: var(--danger); }
.ph-ends { font-size: 12px; color: var(--text-muted); font-style: italic; padding: 6px 8px; }
.ph-qtab-bar { display: flex; gap: 6px; border-bottom: 2px solid var(--border); margin-top: 4px; }
.ph-qtab { flex: 1; font-size: 14px; padding: 10px 6px; background: none; border: none; border-bottom: 3px solid transparent; color: var(--text-muted); font-family: inherit; cursor: pointer; touch-action: manipulation; margin-bottom: -2px; }
.ph-qtab.active { color: var(--focus); border-bottom-color: var(--focus); }
.ph-qtab:active, .ph-qtab:focus { outline: none; color: var(--focus); }
.ph-qtab-panel { display: none; flex-direction: column; gap: 8px; }
.ph-qtab-panel.active { display: flex; }
.ph-qempty { font-size: 13px; color: var(--text-muted); font-style: italic; padding: 12px 8px; }
#screen-bar { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
#screen-bar:empty { display: none; }
.screen-bar-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.screen-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.screen-current { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.screen-current:active, .screen-current:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.screen-btn { width: 100%; padding: 10px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.screen-btn:active, .screen-btn:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.screen-btn.on { border-color: var(--focus); color: var(--focus); }
.screen-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.55); flex-shrink: 0; }
.screen-btn, .screen-current { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-start; }
.screen-btn-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sync-bar { display: flex; }
#sync-bar .seg { width: 100%; }
#sync-bar .seg-opt { flex: 1 1 0; }
.seg { display: inline-flex; flex: 0 0 auto; border: 2px solid var(--border); border-radius: 999px; overflow: hidden; }
.seg-opt { font-size: 13px; padding: 8px 10px; white-space: nowrap; border: none; background: transparent; color: var(--text-muted); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.seg-opt.on { background: var(--surface-hi); color: var(--focus); }
.seg-opt:active { color: var(--focus); }
.seg-opt:focus { outline: 2px solid var(--focus); outline-offset: -2px; }
#topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-shrink: 0; position: relative; }
.desync-off { opacity: 0.35; pointer-events: none; }
.browsing #queue-body { opacity: 0.35; pointer-events: none; }
.browsing #switch-profile { opacity: 0.35; pointer-events: none; }
</style>
</head>
<body>
<div id="conn-status">connecting…</div>
<div id="topbar-actions">
  <div id="status-menu-mount"></div>
</div>
<div id="queue-crumb"></div>
<div id="queue-body"></div>
<script type="module">
import { initQueueShellPage } from '../ui/screens/companion-queue-shell.js';
import { MUSIC } from '../core/queue-shell-config.js';
import { loadMusicSourceTitle } from '../core/app-api.js';
initQueueShellPage({ media: MUSIC, contextPage: 'audio', loadSourceName: loadMusicSourceTitle });
</script>
</body>
</html>
