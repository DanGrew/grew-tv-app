<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>grew-tv</title>
<style>
:root {
  --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 45%, #0f3460 100%);
  --surface: rgba(255,255,255,0.06);
  --surface-hi: rgba(255,255,255,0.11);
  --border: rgba(255,255,255,0.13);
  --focus: #fff;
  --focus-glow: 0 0 0 1px rgba(255,255,255,0.6), 0 4px 24px rgba(255,255,255,0.15);
  --text: rgba(255,255,255,0.95);
  --text-muted: rgba(255,255,255,0.4);
  --radius: 16px;
  --radius-sm: 8px;
  --dur: 0.18s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
  --dock-h: 64px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); background-attachment: fixed; color: var(--text); font-family: var(--font); }
body { display: flex; flex-direction: column; padding: 12px 12px calc(12px + var(--dock-h)) 12px; gap: 10px; }
#conn-status { font-size: 13px; font-family: monospace; color: var(--text-muted); text-align: center; height: 16px; flex-shrink: 0; }
#drill { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; display: flex; flex-direction: column; gap: 14px; }
#drill::-webkit-scrollbar, .chip-row::-webkit-scrollbar, #txtgrid::-webkit-scrollbar { display: none; }
.ph-section { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
.chip-row { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; flex-shrink: 0; }
.chip { white-space: nowrap; background: var(--surface-hi); border: 2px solid var(--border); border-radius: 999px; padding: 9px 15px; font-size: 14px; color: var(--text-muted); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.chip.active { color: var(--focus); border-color: var(--focus); box-shadow: var(--focus-glow); }
.chip:active, .chip:focus { outline: none; color: var(--focus); border-color: var(--focus); }
#rails-wrap, #grid-wrap { display: flex; flex-direction: column; gap: 8px; }
#grid-wrap { overflow-x: hidden; flex: 1; touch-action: pan-y; }
#grid-count { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
#txtgrid { display: grid; grid-template-columns: 1fr; gap: 7px; touch-action: pan-y; }
.pager-head { display: flex; align-items: center; gap: 8px; }
#bottom-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pager-info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.pager-name { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.pager-dots { display: flex; align-items: center; gap: 6px; }
.pager-dot { width: 7px; height: 7px; padding: 0; border-radius: 999px; border: none; background: var(--border); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: background var(--dur) var(--ease), transform var(--dur) var(--ease); }
.pager-dot.active { background: var(--focus); transform: scale(1.3); }
.pager-dot:focus { outline: 1px solid var(--focus); }
.pager-arrow { flex: 0 0 auto; font-size: 20px; line-height: 1; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface-hi); color: var(--text); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease), opacity var(--dur) var(--ease); }
.pager-arrow:active, .pager-arrow:focus { outline: none; color: var(--focus); border-color: var(--focus); }
.pager-arrow:disabled { opacity: 0.3; pointer-events: none; }
.ph-txt { background: var(--surface-hi); border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 12px 11px; font-size: 14px; min-height: 48px; display: flex; align-items: center; gap: 7px; color: var(--text); font-family: inherit; cursor: pointer; text-align: left; touch-action: manipulation; transition: border-color var(--dur) var(--ease); }
.ph-txt .nm { flex: 1; line-height: 1.2; }
.ph-txt .pct { font-size: 11px; color: var(--focus); }
.ph-txt.prog { border-color: var(--focus); }
.ph-txt:active, .ph-txt:focus { outline: none; border-color: var(--focus); }
.ph-txt-cell { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); transition: border-color var(--dur) var(--ease); }
.ph-txt-cell:has(.ph-txt:active), .ph-txt-cell:has(.ph-txt:focus) { border-color: var(--focus); }
.ph-txt-cell .ph-txt { flex: 1; min-width: 0; min-height: 0; border: none; background: none; border-radius: 0; padding: 6px 4px; }
.ph-cell-queue { flex: 0 0 auto; align-self: center; padding: 6px 14px; background: var(--surface-hi); border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 20px; color: var(--text); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.ph-cell-queue:active, .ph-cell-queue:focus { outline: none; border-color: var(--focus); color: var(--focus); }
#queue-status { display: none; position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 11; padding: 12px 22px; background: #1f2d50; border: 2px solid var(--border); border-radius: var(--radius); font-size: 15px; box-shadow: 0 12px 36px rgba(0,0,0,0.5); }
#section-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: var(--dock-h); display: flex; background: #16213e; border-top: 2px solid var(--border); box-shadow: 0 -4px 24px rgba(0,0,0,0.35); }
.dock-tab { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: none; border-top: 3px solid transparent; color: var(--text-muted); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.dock-tab-icon { font-size: 20px; line-height: 1; }
.dock-tab-label { font-size: 11px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.dock-tab.active { color: var(--focus); border-top-color: var(--focus); }
.dock-tab:active, .dock-tab:focus { outline: none; color: var(--focus); }
.chip-create { font-weight: 700; padding-left: 17px; padding-right: 17px; }
#door { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
#door:empty { display: none; }
.door-tile { width: 100%; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 10px 13px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.door-tile:active, .door-tile:focus { outline: none; border-color: var(--focus); color: var(--focus); }
#queue-actions { display: flex; gap: 10px; flex-shrink: 0; }
#btn-play-queue, #btn-play-queue-music { flex: 1 1 0; min-width: 0; font-size: 15px; padding: 12px 16px; border-radius: var(--radius-sm); border: 2px solid var(--focus); background: var(--surface-hi); color: var(--focus); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
#btn-play-queue:active, #btn-play-queue:focus, #btn-play-queue-music:active, #btn-play-queue-music:focus { outline: none; border-color: var(--focus); color: var(--focus); }
#screen-bar { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
#screen-bar:empty { display: none; }
.screen-bar-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.screen-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.screen-current { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.screen-current:active, .screen-current:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.screen-btn { width: 100%; padding: 10px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.screen-btn:active, .screen-btn:focus { outline: none; border-color: var(--focus); color: var(--focus); }
.screen-btn.on { border-color: var(--focus); color: var(--focus); }
.screen-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.55); flex-shrink: 0; }
.screen-btn, .screen-current { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-start; }
.screen-btn-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sync-bar { display: flex; }
#sync-bar .seg { width: 100%; }
#sync-bar .seg-opt { flex: 1 1 0; }
.seg { display: inline-flex; flex: 0 0 auto; border: 2px solid var(--border); border-radius: 999px; overflow: hidden; }
.seg-opt { font-size: 13px; padding: 8px 10px; white-space: nowrap; border: none; background: transparent; color: var(--text-muted); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.seg-opt.on { background: var(--surface-hi); color: var(--focus); }
.seg-opt:active { color: var(--focus); }
.seg-opt:focus { outline: 2px solid var(--focus); outline-offset: -2px; }
.desync-off { opacity: 0.35; pointer-events: none; }
#topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-shrink: 0; position: relative; }
#btn-search { flex: 0 0 auto; font-size: 18px; line-height: 1; padding: 8px 13px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
#btn-search:active, #btn-search:focus { outline: none; border-color: var(--focus); color: var(--focus); }
#search-panel { display: none; position: fixed; inset: 0; z-index: 20; flex-direction: column; gap: 12px; padding: 14px 12px; background: linear-gradient(135deg, #14142a 0%, #12203a 45%, #0c2a4e 100%); }
#search-panel.open { display: flex; }
#search-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
#btn-search-close { flex: 0 0 auto; font-size: 18px; line-height: 1; padding: 9px 15px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease); }
#btn-search-close:active, #btn-search-close:focus { outline: none; border-color: var(--focus); color: var(--focus); }
#search-input { flex-shrink: 0; width: 100%; font-size: 17px; padding: 13px 15px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--surface-hi); color: var(--text); font-family: inherit; }
#search-input::placeholder { color: var(--text-muted); }
#search-input:focus { outline: none; border-color: var(--focus); box-shadow: var(--focus-glow); }
#search-results { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; display: flex; flex-direction: column; gap: 7px; }
#search-results::-webkit-scrollbar { display: none; }
#search-results:empty::after { content: 'Type to search'; color: var(--text-muted); font-size: 14px; padding: 8px 2px; }
.sr-row { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 8px 10px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-hi); color: var(--text); font-family: inherit; font-size: 15px; cursor: pointer; touch-action: manipulation; transition: border-color var(--dur) var(--ease); }
.sr-row:active, .sr-row:focus { outline: none; border-color: var(--focus); }
.sr-thumb { flex: 0 0 auto; width: 52px; height: 52px; object-fit: cover; border-radius: var(--radius-sm); background: var(--surface); }
.sr-thumb-empty { display: block; }
.sr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sr-title { line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-sub { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-tag { flex: 0 0 auto; font-size: 11px; letter-spacing: 1px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; }
</style>
</head>
<body>
<div id="conn-status">connecting…</div>
<div id="topbar-actions">
  <button id="btn-search" type="button" aria-label="Search">🔍</button>
  <div id="status-menu-mount"></div>
</div>
<div id="queue-actions">
<button id="btn-play-queue" type="button" style="display:none">&#127909; (0)</button>
<button id="btn-play-queue-music" type="button" style="display:none">&#127925; (0)</button>
</div>
<div id="drill">
  <div id="rails-wrap">
    <div id="pager-head" class="pager-head">
      <button id="pager-prev" class="pager-arrow" type="button" aria-label="Previous rail">&#8249;</button>
      <div class="pager-info">
        <div id="pager-name" class="pager-name"></div>
        <div id="pager-dots" class="pager-dots"></div>
      </div>
      <button id="pager-next" class="pager-arrow" type="button" aria-label="Next rail">&#8250;</button>
    </div>
  </div>
  <div id="grid-wrap">
    <div id="grid-count"></div>
    <div id="txtgrid"></div>
  </div>
  <div id="bottom-bar">
    <button id="pager-create" class="chip chip-create" type="button" data-create-playlist aria-label="New playlist" style="display:none">&#65291;</button>
  </div>
</div>
<nav id="section-dock"></nav>
<div id="queue-status"></div>
<div id="search-panel">
  <div id="search-head">
    <div class="seg" id="search-seg">
      <button class="seg-opt on" type="button" data-domain="videos">Videos</button>
      <button class="seg-opt" type="button" data-domain="music">Music</button>
    </div>
    <button id="btn-search-close" type="button" aria-label="Close search">✕</button>
  </div>
  <input id="search-input" type="text" placeholder="Search…" autocomplete="off" autocorrect="off" autocapitalize="off">
  <div id="search-results"></div>
</div>
<script type="module">
import { initPage } from '../ui/screens/companion-browse.js';
initPage();
</script>
</body>
</html>
