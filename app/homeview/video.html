#btn-cc.hidden, #btn-prev.hidden, #btn-next.hidden, #btn-queue.hidden, #btn-add-playlist.hidden, #btn-mv-shuffle.hidden, #btn-mv-repeat.hidden, #btn-hm-shuffle.hidden, #btn-hm-repeat.hidden, #btn-film-shuffle.hidden, #btn-film-repeat.hidden, #btn-series-shuffle.hidden, #btn-series-repeat.hidden, #btn-live.hidden, #btn-restart.hidden, #btn-clear-progress.hidden { display: none; }

/* TASK-565 — the card in the gap, and the same card holding an off-air channel

   which screen while it is up, and is pointer-transparent because nothing on it
   is interactive — it is a thing to read, not to operate. The timed lines keep

#time-display { font-size: var(--fs-sm); color: var(--text-muted); min-width: 110px; text-align: right; font-variant-numeric: tabular-nums; }

/* TASK-499 (docs/QUEUE-UX-SHELL.md) — the FEAT-497 Queue UX shell, home
   movies first. A NEW class set (`.qs-*`), not a restyle of `.qtab`/`.q-row`/
   `.now-playing` above: those stay live for every media type not yet cut
   over onto this shell.
   BUG-532 — these are the TV's OWN metrics. The shell was specced
   companion-first and this block took the phone's numbers verbatim: a 390px
   column (an iPhone viewport) inside the 880px `.queue`, 36/44px transport, a
   48px thumb, 18px type — from the sofa, a phone screenshot pasted into the
   middle of a big screen. TASK-515 renders both surfaces from ONE set of
   builders where only class names differ, each surface's own <style> block
   sizing them, so the TV sizes itself here and companion/*-queue.html keeps
   the phone numbers untouched. That IS the FEAT-017/028 mirror: parity of
   function, each surface at its own scale — not identical pixels.
   Every value below comes from a TV surface this app already ships —
   `.now-playing`/`.np-art` and `.q-*`/`.qtab` in this same overlay, and
   `.detail-row`/`.detail-thumb`/`.detail-label` on the detail screen. The one

.qs-tbtn:focus { outline: none; border-color: var(--focus); box-shadow: var(--focus-glow); color: var(--focus); }

.qs-tab.active { color: var(--focus); border-bottom-color: var(--focus); }
.qs-tab:focus { outline: none; color: var(--focus); border-radius: var(--radius-sm); box-shadow: var(--focus-glow); }
.qs-panel { margin: 0; display: none; }
.qs-panel.active { display: block; }
.qs-row { display: flex; align-items: center; gap: 14px; padding: 11px 14px; margin-bottom: 8px; background: var(--surface); border: 2.5px solid var(--border); border-radius: var(--radius); }

.qs-select { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; background: none; border: 2px solid transparent; border-radius: var(--radius-sm); padding: 4px 8px; color: inherit; text-align: left; }

<body>
<div id="screen-video">
  <video id="video" preload="metadata"></video>
  <div id="sound-prompt" class="hidden">🔊 Tap for sound</div>
  <div id="controls">
    <div id="breadcrumb"></div>
    <div id="video-upnext"></div>
    <div id="transport">
      <button id="btn-prev" class="ctrl-btn" aria-label="Previous">&#9198;</button>
      <button id="btn-play-pause" class="ctrl-btn" aria-label="Play/Pause">&#9208;</button>
      <button id="btn-next" class="ctrl-btn" aria-label="Next">&#9197;</button>
      <div id="progress"><div id="progress-fill"></div><i id="live-marker"></i></div>
      <div id="time-display">0:00 / 0:00</div>
